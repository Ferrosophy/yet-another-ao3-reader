# Yet another AO3 reader（YAAO3R）
# 使用 XcodeGen 產生 Xcode 專案：brew install xcodegen && xcodegen generate
name: AO3Reader
options:
  bundleIdPrefix: io.github.ferrosophy
  developmentLanguage: zh-Hant
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: 2.7.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""

targets:
  AO3Reader:
    type: application
    platform: iOS
    sources: [AO3Reader]
    dependencies:
      - package: SwiftSoup
    # iCloud 雲碟同步（個人資料）。未簽名 IPA 不含權限，需在簽名時保留 / 加入 iCloud Documents 能力
    entitlements:
      path: AO3Reader/AO3Reader.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)
        com.apple.developer.icloud-services:
          - CloudDocuments
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ferrosophy.AO3Reader
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: YAAO3R
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 選擇閱讀頁面的背景圖片
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 保存 QR code 到相簿
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # 下載的作品檔案顯示在「檔案」App 的「我的 iPhone › YAAO3R」
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  AO3ReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AO3ReaderTests]
    dependencies:
      - target: AO3Reader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AO3Reader.app/AO3Reader

schemes:
  AO3Reader:
    build:
      targets:
        AO3Reader: all
        AO3ReaderTests: [test]
    test:
      targets: [AO3ReaderTests]
