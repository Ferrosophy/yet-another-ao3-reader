# 使用 XcodeGen 產生 Xcode 專案：brew install xcodegen && xcodegen generate
name: AO3Reader
options:
  bundleIdPrefix: io.github.ferrosophy
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: 2.7.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""

targets:
  AO3Reader:
    type: application
    platform: iOS
    sources: [AO3Reader]
    dependencies:
      - package: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ferrosophy.AO3Reader
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AO3 Reader
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  AO3ReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AO3ReaderTests]
    dependencies:
      - target: AO3Reader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AO3Reader.app/AO3Reader

schemes:
  AO3Reader:
    build:
      targets:
        AO3Reader: all
        AO3ReaderTests: [test]
    test:
      targets: [AO3ReaderTests]
