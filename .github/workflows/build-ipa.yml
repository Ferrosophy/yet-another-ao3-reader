name: Build IPA

# 版本號規則：
# - 推送 tag `v1.2.3` → 版本號 1.2.3，並建立 GitHub Release 附上 IPA
# - 手動執行（workflow_dispatch）→ 使用輸入的版本號；勾選「發行」時建立 tag `v<版本號>` 與 GitHub Release
# - 其他推送 / PR → 使用 project.yml 中的 MARKETING_VERSION
# 建置號（CFBundleVersion）一律為 GitHub Actions 的 run_number，單調遞增。
# IPA 未簽名，需自行重新簽名後安裝。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "版本號（例如 1.0.0），留空則使用 project.yml"
        required: false
      tests:
        description: "同時執行單元測試（另佔一台 macOS 機器，預設不執行）"
        type: boolean
        default: false
      release:
        description: "發行：建立 tag v<版本號> 與 GitHub Release（附 IPA，說明取自 .github/RELEASE_NOTES.md）"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: Unit tests
    # 預設只編譯 IPA；單元測試只在手動執行並勾選「同時執行單元測試」時跑
    if: github.event_name == 'workflow_dispatch' && inputs.tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Run tests
        run: |
          xcodegen generate
          # 取第一個可用的 iPhone 模擬器，避免寫死機型名稱
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Simulator: $DEVICE_ID"
          set -o pipefail
          xcodebuild test \
            -project AO3Reader.xcodeproj \
            -scheme AO3Reader \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

  ipa:
    name: Unsigned IPA
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([0-9.]*\)"\{0,1\}.*/\1/p' project.yml | head -1)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION ($GITHUB_RUN_NUMBER)"

      - name: Build unsigned IPA
        id: build
        run: scripts/build-unsigned-ipa.sh "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.build }}"

      # SHA-256 校驗值：附在 Artifact 與 Release，讓使用者確認 IPA 來自官方建置且未被修改
      - name: Checksum
        id: checksum
        env:
          IPA_PATH: ${{ steps.build.outputs.ipa_path }}
          IPA_NAME: ${{ steps.build.outputs.ipa_name }}
        run: |
          SUM=$(shasum -a 256 "$IPA_PATH" | cut -d ' ' -f 1)
          echo "$SUM  $IPA_NAME" > "$IPA_PATH.sha256"
          echo "sha256=$SUM" >> "$GITHUB_OUTPUT"
          echo "sha256_path=$IPA_PATH.sha256" >> "$GITHUB_OUTPUT"
          {
            cat .github/RELEASE_NOTES.md
            echo
            echo "**SHA-256** (\`$IPA_NAME\`)"
            echo
            echo "\`\`\`"
            echo "$SUM"
            echo "\`\`\`"
            echo
            echo "校验方法 / Verify: \`shasum -a 256 $IPA_NAME\`（macOS / Linux）或 \`Get-FileHash $IPA_NAME\`（Windows PowerShell）。只从本仓库的 GitHub Releases 下载 IPA。"
          } > build/release-notes.md
          echo "SHA-256: $SUM"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.ipa_name }}
          path: |
            ${{ steps.build.outputs.ipa_path }}
            ${{ steps.checksum.outputs.sha256_path }}
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log

      - name: Publish release
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: YAFR ${{ steps.version.outputs.version }}
          files: |
            ${{ steps.build.outputs.ipa_path }}
            ${{ steps.checksum.outputs.sha256_path }}
          body_path: build/release-notes.md
          prerelease: ${{ startsWith(steps.version.outputs.version, '0.') }}
          make_latest: ${{ !startsWith(steps.version.outputs.version, '0.') }}
