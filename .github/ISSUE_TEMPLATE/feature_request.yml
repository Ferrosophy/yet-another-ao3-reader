name: 功能建议 / Feature request
description: 建议新功能或改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: 这是个人维护的项目，会尽量回复，但无法保证每个建议都会实现或实现时间。
  - type: textarea
    id: idea
    attributes:
      label: 建议内容 / Suggestion
      description: 你希望增加或改进什么？想解决什么问题？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他想法 / Alternatives（可选）
